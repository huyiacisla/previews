<!-- Ticket box page (all four portals). Shell and templates only: every Tailwind class lives here, tickets.js clones
     templates, fills text and toggles hidden / data-* / aria-*. Same tokens and patterns as the Messages pages. -->

<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></symbol>
    <symbol id="i-sun-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
  </defs>
</svg>

<a href="#main-content" class="group/button fixed -top-20 left-3 z-toast inline-flex shrink-0 touch-manipulation items-center justify-center gap-1.5 rounded-md border border-transparent bg-primary bg-clip-padding px-2.5 py-1.75 control-text font-medium whitespace-nowrap text-primary-foreground transition outline-none select-none hover:bg-primary/90 focus-visible:top-3 focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50">Skip to main content</a>

<noscript><p class="bg-warning-bg px-step-lg py-step-md text-sm text-warning-text">The Ticket box needs JavaScript. Turn it on in your browser settings and reload this page.</p></noscript>
<div id="app" data-pane="list" class="group/app flex h-dvh min-h-0 flex-col bg-background text-foreground">
  <header class="shrink-0 border-b border-border bg-background">
    <div class="flex w-full items-center gap-step-md px-step-lg py-step-sm lg:px-step-xl">
      <button type="button" id="btn-back" class="group/button inline-flex h-8 shrink-0 touch-manipulation items-center justify-center gap-step-xs rounded-md border border-transparent bg-clip-padding pr-step-md pl-step-sm control-text font-medium whitespace-nowrap text-foreground-secondary transition outline-none select-none hover:bg-muted hover:text-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px pointer-coarse:h-11 [&_svg]:size-4 [&_svg]:shrink-0">
        <svg aria-hidden="true"><use href="#i-arrow-left"/></svg>
        <span id="back-label">Dashboard</span>
      </button>
      <h1 class="min-w-0 flex-1 truncate text-2xl leading-8 font-semibold tracking-tight text-foreground">Ticket box<span id="portal-label" class="ml-step-sm hidden text-sm font-normal tracking-normal text-muted-foreground sm:inline"></span></h1>
      <button type="button" data-theme-toggle aria-label="Switch between light and dark" class="group/button inline-flex size-8 shrink-0 touch-manipulation items-center justify-center rounded-md border border-transparent bg-foreground/8 bg-clip-padding text-secondary-foreground transition outline-none select-none hover:bg-foreground/12 focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px pointer-coarse:size-11 [&_svg]:size-4">
        <svg aria-hidden="true"><use href="#i-sun-moon"/></svg>
      </button>
      <div class="hidden min-w-0 items-center gap-step-sm sm:flex">
        <span id="me-avatar" data-role="staff" class="inline-flex size-8 shrink-0 items-center justify-center rounded-full bg-muted text-xs font-medium text-muted-foreground data-[role=admin]:bg-info-bg data-[role=admin]:text-info-text data-[role=staff]:bg-warning-bg data-[role=staff]:text-warning-text data-[role=client]:bg-success-bg data-[role=client]:text-success-text"></span>
        <span class="flex min-w-0 flex-col leading-tight"><span id="me-name" class="truncate text-sm font-medium"></span><span id="me-role" class="truncate text-xs text-muted-foreground"></span></span>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="min-h-0 flex-1 outline-none">
    <div id="view-app" class="grid h-full min-h-0 gap-step-lg px-step-lg py-step-md lg:grid-cols-[24rem_minmax(0,1fr)] lg:px-step-xl">
      <!-- list -->
      <section id="list-pane" aria-labelledby="list-title" class="flex min-h-0 flex-col overflow-hidden rounded-xl bg-card shadow-lift-xs group-data-[pane=detail]/app:max-lg:hidden">
        <div class="flex flex-col gap-step-md border-b border-border p-step-md">
          <h2 id="list-title" class="text-base leading-snug font-medium">Tickets</h2>
          <div class="relative">
            <label for="search" class="sr-only">Search tickets</label>
            <svg aria-hidden="true" class="pointer-events-none absolute top-1/2 left-2.5 size-4 -translate-y-1/2 text-muted-foreground"><use href="#i-search"/></svg>
            <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search tickets…" class="h-8 w-full min-w-0 rounded-md border border-input bg-card pr-2.5 pl-8 text-base text-ellipsis outline-none transition-colors placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 md:text-sm pointer-coarse:h-11" />
          </div>
          <div id="chips" class="flex flex-wrap gap-step-xs empty:hidden"></div>
          <div id="tabs" role="tablist" aria-label="Show tickets" class="flex flex-wrap gap-step-xs"></div>
        </div>
        <ul id="list" role="list" class="min-h-0 flex-1 divide-y divide-border overflow-y-auto"></ul>
        <div id="list-empty" hidden class="p-step-lg"></div>
      </section>

      <!-- detail -->
      <section id="detail-pane" aria-label="Ticket record" class="flex min-h-0 flex-col overflow-hidden rounded-xl bg-card shadow-lift-xs group-data-[pane=list]/app:max-lg:hidden">
        <div id="detail-none" class="m-auto flex max-w-sm flex-col items-center gap-step-md p-step-xl text-center">
          <span class="inline-flex size-10 items-center justify-center rounded-full bg-muted text-muted-foreground [&_svg]:size-5"><svg aria-hidden="true"><use href="#i-ticket"/></svg></span>
          <h2 class="text-base leading-snug font-medium">Select a ticket</h2>
          <p class="text-sm text-muted-foreground">Open one to read its details and the whole conversation. Closed tickets stay here.</p>
        </div>
        <div id="detail" hidden class="flex min-h-0 flex-1 flex-col max-lg:overflow-y-auto">
          <div class="flex flex-col gap-step-md border-b border-border p-step-lg">
            <div class="flex flex-col gap-step-md sm:flex-row sm:items-start">
              <div class="flex min-w-0 flex-1 flex-col gap-step-xs">
                <p class="flex flex-wrap items-center gap-step-sm text-sm text-muted-foreground"><span id="d-no" class="font-medium text-foreground-secondary tabular-nums"></span><span id="d-badges" class="flex flex-wrap items-center gap-step-xs"></span></p>
                <h2 id="d-subject" tabindex="-1" class="text-xl leading-7 font-semibold tracking-tight wrap-anywhere outline-none"></h2>
              </div>
              <div id="d-actions" class="flex flex-wrap items-center gap-step-sm sm:shrink-0 sm:justify-end"></div>
            </div>
            <dl id="d-meta" class="grid grid-cols-2 gap-x-step-lg gap-y-step-md sm:grid-cols-3"></dl>
          </div>
          <div class="flex items-center gap-step-sm border-b border-border px-step-lg py-step-sm">
            <h3 class="text-sm font-medium">Conversation</h3>
            <span id="d-count" class="text-xs text-muted-foreground tabular-nums"></span>
            <span class="ml-auto text-xs text-muted-foreground">Read only</span>
          </div>
          <div id="record" tabindex="0" aria-label="Conversation record" class="min-h-0 flex-1 outline-none focus-visible:ring-3 focus-visible:ring-inset focus-visible:ring-ring/50 lg:overflow-y-auto"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="toasts" class="pointer-events-none fixed inset-x-0 top-step-lg z-toast flex flex-col items-center gap-step-sm px-step-lg"></div>

<!-- ============ templates ============ -->
<template id="t-row">
  <li>
    <button type="button" data-row class="flex w-full flex-col gap-step-xs px-step-md py-step-md text-left outline-none transition-colors hover:bg-muted focus-visible:ring-3 focus-visible:ring-inset focus-visible:ring-ring/50 aria-[current=true]:bg-accent pointer-coarse:min-h-11">
      <span class="flex items-center gap-step-sm"><span data-no class="min-w-0 flex-1 text-xs font-medium text-muted-foreground tabular-nums"></span><time data-time class="shrink-0 text-xs text-muted-foreground tabular-nums"></time></span>
      <span data-subject class="truncate text-sm font-medium"></span>
      <span data-badges class="flex flex-wrap items-center gap-step-xs empty:hidden"></span>
      <span data-who class="truncate text-xs text-muted-foreground"></span>
    </button>
  </li>
</template>

<template id="t-badge">
  <span data-slot="badge" data-tone="neutral" class="inline-flex h-5 shrink-0 items-center gap-step-xs rounded-full bg-secondary px-step-sm text-xs font-normal whitespace-nowrap text-secondary-foreground data-[tone=danger]:bg-danger-bg data-[tone=danger]:text-danger-text data-[tone=info]:bg-info-bg data-[tone=info]:text-info-text data-[tone=success]:bg-success-bg data-[tone=success]:text-success-text data-[tone=warning]:bg-warning-bg data-[tone=warning]:text-warning-text [&_svg]:size-3"></span>
</template>

<template id="t-tab">
  <button type="button" role="tab" aria-selected="false" class="group/button inline-flex h-8 shrink-0 touch-manipulation items-center justify-center gap-step-xs rounded-md border border-transparent bg-clip-padding px-step-md control-text font-medium whitespace-nowrap text-foreground-secondary transition outline-none select-none hover:bg-muted focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 aria-selected:bg-accent aria-selected:text-primary pointer-coarse:h-11"><span data-label></span><span data-count class="text-xs text-muted-foreground tabular-nums"></span></button>
</template>

<template id="t-fchip">
  <button type="button" class="inline-flex h-6 items-center gap-step-xs rounded-md bg-secondary px-step-sm text-xs text-secondary-foreground outline-none transition-colors hover:bg-secondary/80 focus-visible:ring-3 focus-visible:ring-ring/50 pointer-coarse:h-8"><span data-label></span></button>
</template>

<template id="t-btn">
  <button type="button" data-variant="outline" class="group/button inline-flex h-8 shrink-0 touch-manipulation items-center justify-center gap-step-sm rounded-md border border-transparent bg-background bg-clip-padding px-step-md control-text font-medium whitespace-nowrap text-foreground ring-1 ring-foreground/10 transition outline-none select-none hover:bg-muted focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px disabled:pointer-events-none disabled:opacity-50 data-[variant=primary]:bg-primary data-[variant=primary]:text-primary-foreground data-[variant=primary]:ring-0 data-[variant=primary]:hover:bg-primary/90 pointer-coarse:h-11 [&_svg]:size-4 [&_svg]:shrink-0"><svg data-icon hidden aria-hidden="true"><use href="#i-download"/></svg><span data-label></span></button>
</template>

<template id="t-meta">
  <div class="flex min-w-0 flex-col gap-0.5"><dt data-k class="text-xs text-muted-foreground"></dt><dd data-v data-tone="default" class="text-sm font-medium wrap-anywhere data-[tone=danger]:text-danger-text data-[tone=success]:text-success-text data-[tone=warning]:text-warning-text"></dd></div>
</template>

<template id="t-day"><div class="sticky top-0 z-raised border-b border-border bg-card px-step-lg py-step-xs"><time data-day class="text-xs font-medium text-muted-foreground"></time></div></template>

<!-- one message of the record: who, when, what -->
<template id="t-entry">
  <article data-entry class="flex gap-step-md px-step-lg py-step-md data-[emergency=true]:border-l-4 data-[emergency=true]:border-danger-text data-[emergency=true]:bg-danger-bg">
    <span data-avatar></span>
    <div class="flex min-w-0 flex-1 flex-col gap-step-xs">
      <p class="flex flex-wrap items-baseline gap-x-step-sm gap-y-0 text-sm"><span data-name class="font-medium"></span><span data-rolelabel class="text-xs text-muted-foreground"></span><time data-time class="text-xs text-muted-foreground tabular-nums"></time><span data-flags class="flex items-center gap-step-xs text-xs text-muted-foreground"></span></p>
      <p data-text class="max-w-prose text-sm leading-6 wrap-anywhere whitespace-pre-wrap text-foreground"></p>
      <ul data-files role="list" hidden class="flex flex-wrap gap-step-sm"></ul>
    </div>
  </article>
</template>

<!-- a note from the system, kept quiet -->
<template id="t-note">
  <div class="flex items-center gap-step-sm px-step-lg py-step-sm text-xs text-muted-foreground"><span class="h-px flex-1 bg-border"></span><p data-text class="max-w-prose text-center wrap-anywhere"></p><span class="h-px flex-1 bg-border"></span></div>
</template>

<!-- audit card: what changed, who did it, when (ISO) -->
<template id="t-audit">
  <div class="flex items-start gap-step-md px-step-lg py-step-sm">
    <span class="inline-flex size-6 shrink-0 items-center justify-center rounded-full bg-secondary text-secondary-foreground [&_svg]:size-3"><svg aria-hidden="true"><use href="#i-shield"/></svg></span>
    <p class="flex min-w-0 flex-col text-xs"><span data-change class="font-medium text-foreground-secondary"></span><span class="text-muted-foreground tabular-nums"><span data-actor></span> · <time data-time></time></span></p>
  </div>
</template>

<template id="t-file">
  <li><a data-link target="_blank" rel="noopener noreferrer" class="inline-flex max-w-full items-center gap-step-sm rounded-lg bg-background px-step-md py-step-sm text-xs ring-1 ring-foreground/10 outline-none transition-colors hover:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50 pointer-coarse:min-h-11 [&_svg]:size-4 [&_svg]:shrink-0"><svg aria-hidden="true"><use href="#i-paperclip"/></svg><span data-name class="truncate"></span><span data-size class="shrink-0 text-muted-foreground tabular-nums"></span></a></li>
</template>

<template id="t-avatar">
  <span data-slot="avatar" data-role="resident" class="inline-flex size-8 shrink-0 items-center justify-center rounded-full bg-muted text-xs font-medium text-muted-foreground data-[role=admin]:bg-info-bg data-[role=admin]:text-info-text data-[role=bot]:bg-accent data-[role=bot]:text-primary data-[role=staff]:bg-warning-bg data-[role=staff]:text-warning-text data-[role=client]:bg-success-bg data-[role=client]:text-success-text"></span>
</template>

<template id="t-empty">
  <div class="flex flex-col items-center gap-step-md py-step-xl text-center">
    <span class="inline-flex size-10 items-center justify-center rounded-full bg-muted text-muted-foreground [&_svg]:size-5"><svg aria-hidden="true"><use href="#i-ticket"/></svg></span>
    <h3 data-title class="text-base leading-snug font-medium"></h3>
    <p data-text class="max-w-xs text-sm text-muted-foreground"></p>
    <div data-actions class="flex flex-wrap justify-center gap-step-sm"></div>
  </div>
</template>

<template id="t-toast">
  <div role="status" class="pointer-events-auto flex max-w-md items-center gap-step-md rounded-lg bg-foreground px-step-lg py-step-md text-sm text-background shadow-lift-md"><span data-text></span></div>
</template>
